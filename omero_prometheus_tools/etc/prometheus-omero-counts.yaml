# HQL queries for fetching metrics
# Inspired by the postgres-exporter configuration
# https://github.com/wrouesnel/postgres_exporter/blob/v0.4.6/queries.yaml

# Format is
#
#     metric_name
#       description: Description of the metric
#       query: HQL query that returns <NUMBER> [<STRING> ...]
#       labels: [<LABEL> ...]
#
# <NUMBER> is the metric value
# Optional <STRING>s and <LABEL>s are label values and names

omero_counts_datasets_total:
  description: Number of datasets per group and user_id
  query: SELECT COUNT(*), details.group.name, details.owner.id FROM Dataset GROUP BY details.group.name, details.owner.id
  labels: [group, user_id]

omero_counts_filesets_total:
  description: Number of filesets per group and user_id
  query: SELECT COUNT(*), details.group.name, details.owner.id FROM Fileset GROUP BY details.group.name, details.owner.id
  labels: [group, user_id]

omero_counts_images_total:
  description: Number of images per group and user_id
  query: SELECT COUNT(*), details.group.name, details.owner.id FROM Image GROUP BY details.group.name, details.owner.id
  labels: [group, user_id]

omero_counts_projects_total:
  description: Number of projects per group and user_id
  query: SELECT COUNT(*), details.group.name, details.owner.id FROM Project GROUP BY details.group.name, details.owner.id
  labels: [group, user_id]

omero_usage_files_bytes_total:
  description: Disk space used by original files in bytes per group and user_id
  query: >-
    SELECT SUM(origFile.size),
    group.name, owner.id
    FROM OriginalFile AS origFile
    JOIN origFile.details.group AS group
    JOIN origFile.details.owner AS owner
    WHERE origFile.size IS NOT NULL
    GROUP BY group.name, owner.id
  labels: [group, user_id]
